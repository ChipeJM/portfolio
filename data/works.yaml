  - title: The Plague
    year: 2026
    type: PC game
    role: Group project
    summary: >-
      A complete 2D side-scrolling zombie survival shooter for Windows,
      built in Unity 6 with C#. A lone soldier fights waves of zombies
      across three levels (a castle hall, a graveyard and a throne room),
      each with its own zombie type and music.
    highlights:
      - >-
        **Zombie AI.** Zombies notice the soldier, chase and attack it, with
        a "leash" that stops them ever being left behind, so every level
        can always be finished.
      - >-
        **Raycast shooting.** Shots are instant raycasts, replacing an
        earlier bullet-object version that was costlier and could miss
        between physics steps.
      - >-
        **One class, three difficulties.** Easy, Normal and Hard come from
        a single settings class of five multipliers, so no level had to be
        duplicated.
      - >-
        **A finished game.** Main menu, pause menu, victory and death
        screens, a live zombie counter, looping backgrounds, and volume and
        difficulty settings saved between sessions.
    facts:
      - value: "3"
        label: Levels
      - value: "3"
        label: Zombie types
      - value: "3"
        label: Difficulties
      - value: "17"
        label: C# scripts
    tags: [Unity 6, C#, URP 2D, Input System, TextMeshPro, 2D Animation]
