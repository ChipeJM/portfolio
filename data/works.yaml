intro: >-
  Two group projects from my studies at the University of Dodoma: a
  campus news app for Android and a complete 2D zombie survival game.

projects:
  - title: UDOM Today
    year: 2026
    type: Android app
    role: Co-creator · group project
    summary: >-
      Campus news at the University of Dodoma was scattered across notice
      boards, the university website and dozens of WhatsApp groups.
      UDOM Today puts it in one feed that students can filter by college,
      search, and save to read offline.
    highlights:
      - >-
        **Three roles.** Students read and save; entrusted reporters
        publish, edit and delete their own articles with a cover image and
        an optional short video; an admin promotes or demotes reporters
        from inside the app.
      - >-
        **Server-side security.** A PHP and MySQL REST API issues random
        login tokens and checks the caller's token and role before every
        protected action.
      - >-
        **Smooth uploads.** Images are shrunk before upload, videos are
        capped at 25 MB and 60 seconds, and one progress bar covers both
        files.
      - >-
        **Offline reading.** Saved articles are stored on the phone with
        Room and open without internet, pictures included.
    facts:
      - value: "3"
        label: User roles
      - value: "7"
        label: UDOM colleges
      - value: "14/14"
        label: Tests passed
      - value: "7.0+"
        label: Android version
    tags: [Java, Android SDK, MVVM, Retrofit2, Room, Glide, PHP, MySQL]
